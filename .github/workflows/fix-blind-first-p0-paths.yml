name: Retarget Blind-first Upgrade

on:
  push:
    paths:
      - '.github/workflows/fix-blind-first-p0-paths.yml'

permissions:
  contents: write

jobs:
  retarget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retarget workflow to root app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/apply-blind-first-p0.yml')
          s=p.read_text(encoding='utf-8')
          s=s.replace("Path('screen-flow-standalone/index.html')","Path('index.html')")
          s=s.replace("Path('screen-flow-standalone/tts.js')","Path('tts.js')")
          s=s.replace("Path('screen-flow-standalone/assets/items')","Path('assets/items')")
          s=s.replace('git add screen-flow-standalone/index.html screen-flow-standalone/tts.js screen-flow-standalone/assets/items','git add index.html tts.js assets/items')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/apply-blind-first-p0.yml
          git commit -m 'fix: retarget blind-first upgrade to root app'
          git push
