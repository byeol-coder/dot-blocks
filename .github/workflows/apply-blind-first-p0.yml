name: Apply Blind-first P0 Upgrade

on:
  push:
    paths:
      - '.github/workflows/apply-blind-first-p0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply accessibility and asset upgrade
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          index_path = Path('screen-flow-standalone/index.html')
          text = index_path.read_text(encoding='utf-8')

          def sub(pattern, replacement, label, flags=0):
              global text
              next_text, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              text = next_text

          # 1) UI controls: speech source and tactile/turn-based speeds.
          sub(
              r'<button class="toggle" id="speechToggle" type="button" aria-pressed="true"><span id="speechLabel">음성 안내</span><span id="speechState">켜짐</span></button>',
              '<button class="toggle" id="speechToggle" type="button" aria-pressed="true"><span id="speechLabel">음성 안내</span><span id="speechState">켜짐</span></button>\n'
              '      <div class="speed-row"><label for="speechModeSelect" id="speechModeLabel">음성 안내 방식</label><select id="speechModeSelect"><option value="superdot">슈퍼닷 TTS</option><option value="screenreader">스크린리더만</option><option value="both">둘 다</option></select></div>',
              'speech mode UI'
          )
          sub(
              r'<select id="speedSelect">.*?</select>',
              '<select id="speedSelect"><option value="tactile">촉각 저속</option><option value="turn">촉각 턴제</option><option value="relaxed">여유</option><option value="standard">표준</option><option value="challenge">도전</option></select>',
              'speed options', re.S
          )

          # 2) Settings model and element references.
          sub(
              r"const speechToggle=\$\('speechToggle'\),sfxToggle=\$\('sfxToggle'\),musicToggle=\$\('musicToggle'\),assistToggle=\$\('assistToggle'\),speedSelect=\$\('speedSelect'\),musicStyleSelect=\$\('musicStyleSelect'\);",
              "const speechToggle=$('speechToggle'),sfxToggle=$('sfxToggle'),musicToggle=$('musicToggle'),assistToggle=$('assistToggle'),speedSelect=$('speedSelect'),musicStyleSelect=$('musicStyleSelect'),speechModeSelect=$('speechModeSelect');",
              'settings element refs'
          )
          sub(
              r"let settings=\{speech:true,sfx:true,music:true,assist:true,speed:'[^']+',musicStyle:'procedural'\};",
              "let settings={speech:true,speechMode:'superdot',sfx:true,music:true,assist:true,speed:'tactile',musicStyle:'procedural'};",
              'settings defaults'
          )
          sub(
              r"settings\.speed=\[[^\]]+\]\.includes\(settings\.speed\)\?settings\.speed:'relaxed';",
              "settings.speed=['tactile','turn','relaxed','standard','challenge'].includes(settings.speed)?settings.speed:'tactile';",
              'speed validation'
          )
          sub(
              r"settings\.musicStyle=\['procedural','retro'\]\.includes\(settings\.musicStyle\)\?settings\.musicStyle:'procedural';",
              "settings.musicStyle=['procedural','retro'].includes(settings.musicStyle)?settings.musicStyle:'procedural';\n  settings.speechMode=['superdot','screenreader','both'].includes(settings.speechMode)?settings.speechMode:'superdot';",
              'speech mode validation'
          )
          sub(
              r"let dropTimer=0,dropLast=0,gravityAccumulator=0,groundedAt=0,lastDanger=0;",
              "let dropTimer=0,dropLast=0,gravityAccumulator=0,groundedAt=0,lastDanger=0;\n  let padMenu='intro',padSettingIndex=0,confirmAction='',confirmUntil=0;\n  const PAD_SETTING_KEYS=['speech','speechMode','sfx','music','assist','speed','musicStyle'];",
              'pad menu state'
          )

          # 3) SuperDot TTS / screen reader separation.
          sub(
              r"  function stopSpeech\(\)\{.*?\n  function announce\(text,\{phase='play',tts=true,critical=false\}=\{\}\)\{.*?\}\n",
              """  function screenReaderSpeech(){return settings.speechMode==='screenreader'||settings.speechMode==='both'}
  function syntheticSpeech(){return settings.speechMode==='superdot'||settings.speechMode==='both'}
  function syncSpeechModeAria(){
    status.setAttribute('aria-live',screenReaderSpeech()?'polite':'off');
    criticalLive.setAttribute('aria-live',screenReaderSpeech()?'assertive':'off');
    if(window.TW_TTS){TW_TTS.setLang&&TW_TTS.setLang(LANG);TW_TTS.setEnabled&&TW_TTS.setEnabled(settings.speech&&syntheticSpeech());TW_TTS.config&&TW_TTS.config({serverFirst:true,retry:!/(^|\\.)github\\.io$/i.test(location.hostname)})}
  }
  function stopSpeech(){if(window.TW_TTS&&TW_TTS.stop)TW_TTS.stop();try{speechSynthesis.cancel()}catch(e){}}
  function speak(text,critical=false){
    if(!text)return;
    if(critical&&screenReaderSpeech()){criticalLive.textContent='';requestAnimationFrame(()=>criticalLive.textContent=text)}
    if(!settings.speech||!syntheticSpeech())return;
    audio.duck(Math.min(5200,900+text.length*55));
    if(window.TW_TTS){TW_TTS.setLang&&TW_TTS.setLang(LANG);TW_TTS.speak(text);return}
    try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=LANG==='en'?'en-US':'ko-KR';u.rate=.95;speechSynthesis.speak(u)}catch(e){}
  }
  function announce(text,{phase='play',tts=true,critical=false}={}){statusText.textContent=text;status.dataset.phase=phase;if(tts)speak(text,critical);else if(critical&&screenReaderSpeech()){criticalLive.textContent='';requestAnimationFrame(()=>criticalLive.textContent=text)}}
""",
              'speech routing', re.S
          )

          # 4) Tactile-friendly drop speeds, including a true turn-based mode.
          sub(
              r"  function speedBase\(\)\{.*?\}\n  function gravityInterval\(\)\{.*?\}\n  function lockDelay\(\)\{.*?\}\n",
              """  function speedBase(){if(settings.speed==='tactile')return 3000;if(settings.speed==='turn')return Infinity;return settings.speed==='challenge'?640:settings.speed==='standard'?820:1050}
  function gravityInterval(){if(settings.speed==='turn')return Infinity;if(settings.speed==='tactile')return Math.max(1800,3000-(level-1)*85);const base=speedBase(),step=settings.speed==='challenge'?65:settings.speed==='standard'?58:42;return Math.max(settings.speed==='relaxed'?260:110,base-(level-1)*step)}
  function lockDelay(){if(settings.speed==='turn')return Infinity;if(settings.speed==='tactile')return 2600;if(!settings.assist)return 260;return settings.speed==='challenge'?520:settings.speed==='standard'?700:950}
""",
              'drop speeds', re.S
          )
          sub(
              r"  function dropLoop\(now\)\{.*?\n  \}",
              """  function dropLoop(now){
    if(mode!=='drop'||!running||over)return;
    if(!paused&&!scanMode&&!isAnimating){
      const dt=Math.min(120,now-dropLast);
      if(settings.speed!=='turn'){
        gravityAccumulator+=dt;
        if(gravityAccumulator>=gravityInterval()){gravityAccumulator=0;moveDrop(0,1,{auto:true})}
        if(active&&collides(active,0,1,active.cells)){if(!groundedAt)groundedAt=now;if(now-groundedAt>=lockDelay())lockDrop()}else groundedAt=0
      }
    }
    dropLast=now;dropTimer=requestAnimationFrame(dropLoop)
  }""",
              'turn based loop', re.S
          )
          sub(
              r"if\(dy>0&&!groundedAt\)\{groundedAt=performance\.now\(\);audio\.earcon\('ground',\{pan:panForColumn\(active\.x,DROP_W\),row:Math\.max\(0,active\.y\)\}\)\}",
              "if(dy>0&&!groundedAt){groundedAt=performance.now();audio.earcon('ground',{pan:panForColumn(active.x,DROP_W),row:Math.max(0,active.y)});if(settings.speed==='turn'&&!auto)speak(S('바닥입니다. F2와 F3을 다시 눌러 블록을 확정하세요.','On the floor. Press F2 and F3 again to confirm the piece.'))}",
              'turn floor cue'
          )

          # 5) Tactile grammar: settled = compact dense tile, active = full-cell hollow outline.
          sub(
              r"  function fillTactileCell\(g,x,y,cw,ch,kind\)\{.*?\n  \}",
              """  function fillTactileCell(g,x,y,cw,ch,kind){
    const ox=x*cw,oy=y*ch;
    if(kind==='solid'){
      for(let yy=0;yy<ch-1;yy++)for(let xx=0;xx<cw-1;xx++)setPin(g,ox+xx,oy+yy)
    }else if(kind==='active'){
      for(let xx=0;xx<cw;xx++){setPin(g,ox+xx,oy);setPin(g,ox+xx,oy+ch-1)}
      for(let yy=1;yy<ch-1;yy++){setPin(g,ox,oy+yy);setPin(g,ox+cw-1,oy+yy)}
    }else if(kind==='ghost'){
      const cy=oy+Math.floor((ch-1)/2);setPin(g,ox+Math.max(1,Math.floor(cw/2)-1),cy);setPin(g,ox+Math.min(cw-2,Math.floor(cw/2)),cy)
    }else if(kind==='invalid'){
      const n=Math.min(cw,ch);for(let i=0;i<n;i++){setPin(g,ox+i,oy+i);setPin(g,ox+cw-1-i,oy+i)}
    }else if(kind==='surface'){
      for(let xx=0;xx<cw;xx++)setPin(g,ox+xx,oy)
    }else if(kind==='flash'){
      for(let yy=0;yy<ch;yy++)for(let xx=0;xx<cw;xx++)setPin(g,ox+xx,oy+yy)
    }
  }""",
              'tactile cell grammar', re.S
          )
          sub(
              r"function buildPortraitFrame\(\)\{const g=blankPortrait\(\);if\(mode==='drop'\)\{",
              "function buildPortraitFrame(){const g=blankPortrait();if(mode==='drop'){if(flashRows.length){for(const y of flashRows)for(let x=0;x<DROP_W;x++)fillTactileCell(g,x,y,4,3,'flash');return g}",
              'line flash tactile frame'
          )

          # 6) Confirm destructive actions and expose all essential choices on DotPad keys.
          marker = "  // ---------- DOTPAD ----------\n"
          if marker not in text:
              raise SystemExit('dotpad marker missing')
          helpers = r'''  function clearConfirm(){confirmAction='';confirmUntil=0}
  function confirmActionTwice(name,prompt,action){
    const now=performance.now();
    if(confirmAction===name&&now<confirmUntil){clearConfirm();action();return true}
    confirmAction=name;confirmUntil=now+1800;audio.earcon('blocked');speak(prompt);return false
  }
  function confirmedHardDrop(){return confirmActionTwice('hardDrop',S('즉시 낙하 확인. 1.8초 안에 같은 키를 한 번 더 누르세요.','Hard drop confirmation. Press the same key again within 1.8 seconds.'),hardDrop)}
  function confirmedRestart(){return confirmActionTwice('restart',S('다시 시작 확인. 1.8초 안에 F1을 한 번 더 누르세요.','Restart confirmation. Press F1 again within 1.8 seconds.'),newGame)}
  function padSettingName(key){return {speech:S('음성 안내','speech guidance'),speechMode:S('음성 안내 방식','speech source'),sfx:S('방향 효과음','directional effects'),music:S('배경음악','music'),assist:S('잠금 유예','lock delay'),speed:S('낙하 방식','drop style'),musicStyle:S('음악 스타일','music style')}[key]}
  function padSettingValue(key){if(key==='speechMode')return {superdot:S('슈퍼닷 TTS','SuperDot TTS'),screenreader:S('스크린리더만','screen reader only'),both:S('둘 다','both')}[settings.speechMode];if(key==='speed')return {tactile:S('촉각 저속','tactile slow'),turn:S('촉각 턴제','tactile turn based'),relaxed:S('여유','relaxed'),standard:S('표준','standard'),challenge:S('도전','challenge')}[settings.speed];if(key==='musicStyle')return settings.musicStyle==='retro'?S('레트로','retro'):S('앰비언트','ambient');return settings[key]?S('켜짐','on'):S('꺼짐','off')}
  function announcePadSetting(){const key=PAD_SETTING_KEYS[padSettingIndex];speak((padSettingIndex+1)+'/'+PAD_SETTING_KEYS.length+'. '+padSettingName(key)+', '+padSettingValue(key)+'. '+S('F1 이전, F2 다음, F3 변경, F4 닫기.','F1 previous, F2 next, F3 change, F4 close.'))}
  function syncSettingUI(){
    setToggle(speechToggle,'speechState',settings.speech);setToggle(sfxToggle,'sfxState',settings.sfx);setToggle(musicToggle,'musicState',settings.music);setToggle(assistToggle,'assistState',settings.assist);
    speechModeSelect.value=settings.speechMode;speedSelect.value=settings.speed;musicStyleSelect.value=settings.musicStyle;syncSpeechModeAria();saveSettings()
  }
  function enterPadSettings(){padMenu='settings';padSettingIndex=0;clearConfirm();announcePadSetting()}
  function changePadSetting(){const key=PAD_SETTING_KEYS[padSettingIndex];if(key==='speechMode'){const a=['superdot','screenreader','both'];settings.speechMode=a[(a.indexOf(settings.speechMode)+1)%a.length]}else if(key==='speed'){const a=['tactile','turn','relaxed','standard','challenge'];settings.speed=a[(a.indexOf(settings.speed)+1)%a.length]}else if(key==='musicStyle'){settings.musicStyle=settings.musicStyle==='procedural'?'retro':'procedural';audio.setMusicStyle(settings.musicStyle)}else{settings[key]=!settings[key];if(key==='sfx')audio.setSfxEnabled(settings.sfx);if(key==='music')audio.setMusicEnabled(settings.music)}syncSettingUI();announcePadSetting()}
  function handlePadSettingsKey(keyCode){if(keyCode===KeyCodes.KeyFunction1){padSettingIndex=(padSettingIndex+PAD_SETTING_KEYS.length-1)%PAD_SETTING_KEYS.length;announcePadSetting()}else if(keyCode===KeyCodes.KeyFunction2){padSettingIndex=(padSettingIndex+1)%PAD_SETTING_KEYS.length;announcePadSetting()}else if(keyCode===KeyCodes.KeyFunction3){changePadSetting()}else if(keyCode===KeyCodes.KeyFunction4){padMenu=introScreen.hidden?null:'intro';speak(S('설정을 닫았습니다.','Settings closed.'))}}

'''
          text = text.replace(marker, helpers + marker, 1)

          sub(
              r"  function handleDotPadKey\(keyCode\)\{.*?\n  \}\n  async function loadSDK",
              """  function handleDotPadKey(keyCode){
    if(!KeyCodes)return;document.body.classList.add('kbd');ensureAudio();
    if(padMenu==='settings'){handlePadSettingsKey(keyCode);return}
    if(!introScreen.hidden){
      if(keyCode===KeyCodes.KeyFunction1){setMode('drop',false);showPlay();newGame()}
      else if(keyCode===KeyCodes.KeyFunction2){setMode('puzzle',false);showPlay();newGame()}
      else if(keyCode===KeyCodes.KeyFunction3){tutorial()}
      else if(keyCode===KeyCodes.KeyFunction4){enterPadSettings()}
      return
    }
    if(over){
      if(keyCode===KeyCodes.KeyFunction1||keyCode===KeyCodes.LPF1)confirmedRestart();
      else if(keyCode===KeyCodes.KeyFunction2){showIntro();speak(S('모드 선택. F1 낙하, F2 퍼즐, F3 도움말, F4 설정.','Mode selection. F1 drop, F2 puzzle, F3 help, F4 settings.'))}
      else if(keyCode===KeyCodes.KeyFunction4)enterPadSettings();
      return
    }
    if(KeyCodes.LPF4!==undefined&&keyCode===KeyCodes.LPF4){enterPadSettings();return}
    if(mode==='drop'){
      if(keyCode===KeyCodes.KeyFunction1)moveDrop(-1,0);else if(keyCode===KeyCodes.KeyFunction2)moveDrop(1,0);else if(keyCode===KeyCodes.KeyFunction3)rotateDrop();else if(keyCode===KeyCodes.KeyFunction4)moveDrop(0,1);else if(keyCode===KeyCodes.KeyFunction12)holdDrop();else if(keyCode===KeyCodes.KeyFunction23||keyCode===KeyCodes.PanningRight)confirmedHardDrop();else if(keyCode===KeyCodes.PanningLeft)readDropStatus(false);else if(keyCode===KeyCodes.PanningAll)toggleScan();else if(keyCode===KeyCodes.RPF4)togglePause();else if(keyCode===KeyCodes.LPF1)confirmedRestart();else if(keyCode===KeyCodes.KeyFunction34)readDropStatus(true);else if(keyCode===KeyCodes.KeyFunction24&&typeof readNextHold==='function')readNextHold()
    }else{
      if(keyCode===KeyCodes.KeyFunction1)movePuzzle(-1,0);else if(keyCode===KeyCodes.KeyFunction2)movePuzzle(1,0);else if(keyCode===KeyCodes.KeyFunction3)movePuzzle(0,-1);else if(keyCode===KeyCodes.KeyFunction4)movePuzzle(0,1);else if(keyCode===KeyCodes.PanningLeft)rotatePuzzle();else if(keyCode===KeyCodes.PanningRight)cyclePuzzle();else if(keyCode===KeyCodes.PanningAll||keyCode===KeyCodes.KeyFunction23)placePuzzle();else if(keyCode===KeyCodes.KeyFunction12)readPuzzleStatus(true);else if(keyCode===KeyCodes.RPF4)readPuzzleStatus(false);else if(keyCode===KeyCodes.LPF1)confirmedRestart()
    }
  }
  async function loadSDK""",
              'DotPad navigation', re.S
          )
          sub(
              r"function setDpUI\(on\)\{(.*?)if\(on\)speak\((.*?)\)\}",
              "function setDpUI(on){\\1if(on){padMenu=introScreen.hidden?null:'intro';speak(S('닷패드가 연결됐어요. 기기를 세로로 세우세요. 인트로에서는 F1 낙하 모드, F2 블록 퍼즐, F3 도움말, F4 설정입니다.','DotPad connected. Stand it vertically. On the intro screen, F1 is Drop Mode, F2 Block Puzzle, F3 Help, and F4 Settings.'))}}",
              'DotPad connection prompt', re.S
          )

          # Keep pad navigation state in sync with screen flow.
          sub(r"function showIntro\(\)\{", "function showIntro(){padMenu='intro';clearConfirm();", 'showIntro state')
          sub(r"function showPlay\(\)\{", "function showPlay(){padMenu=null;clearConfirm();", 'showPlay state')

          # Keyboard hard drop and restart receive the same guard.
          text = text.replace("if(k==='n'||k==='N'){newGame();ev.preventDefault();return}", "if(k==='n'||k==='N'){confirmedRestart();ev.preventDefault();return}")
          text = text.replace("else if(k===' ')hardDrop();", "else if(k===' ')confirmedHardDrop();")

          # 7) Settings events and translations for the new controls.
          sub(
              r"speechToggle\.addEventListener\('click',\(\)=>\{settings\.speech=!settings\.speech;.*?\}\);",
              "speechToggle.addEventListener('click',()=>{settings.speech=!settings.speech;syncSettingUI();if(settings.speech)speak(S('음성 안내를 켰어요.','Speech guidance on.'));else stopSpeech()});",
              'speech toggle event', re.S
          )
          insert_after = "  musicStyleSelect.value=settings.musicStyle;"
          if insert_after not in text:
              raise SystemExit('musicStyleSelect initialization missing')
          text = text.replace(insert_after, "  speechModeSelect.value=settings.speechMode;\n  speechModeSelect.addEventListener('change',()=>{settings.speechMode=speechModeSelect.value;syncSettingUI();speak(S('음성 안내 방식을 변경했습니다.','Speech source changed.'))});\n" + insert_after, 1)
          sub(
              r"speedSelect\.value=settings\.speed;speedSelect\.addEventListener\('change',\(\)=>\{settings\.speed=speedSelect\.value;saveSettings\(\);speak\(S\('낙하 속도 '.+?\}\);",
              "speedSelect.value=settings.speed;speedSelect.addEventListener('change',()=>{settings.speed=speedSelect.value;saveSettings();speak(S('낙하 방식을 '+speedSelect.options[speedSelect.selectedIndex].text+'로 설정했습니다.','Drop style changed.'))});",
              'speed event', re.S
          )
          text = text.replace("  setToggle(speechToggle,'speechState',settings.speech);setToggle(sfxToggle,'sfxState',settings.sfx);setToggle(musicToggle,'musicState',settings.music);setToggle(assistToggle,'assistState',settings.assist);", "  setToggle(speechToggle,'speechState',settings.speech);setToggle(sfxToggle,'sfxState',settings.sfx);setToggle(musicToggle,'musicState',settings.music);setToggle(assistToggle,'assistState',settings.assist);syncSpeechModeAria();")

          # English copy: preserve the recently fixed applyLang() structure and add new labels/options.
          needle = "$('speechLabel').textContent='Speech guidance';"
          if needle not in text:
              raise SystemExit('English speech label missing')
          text = text.replace(needle, needle + "$('speechModeLabel').textContent='Speech source';speechModeSelect.options[0].text='SuperDot TTS';speechModeSelect.options[1].text='Screen reader only';speechModeSelect.options[2].text='Both';", 1)
          text = text.replace("speedSelect.options[0].text='Relaxed';speedSelect.options[1].text='Standard';speedSelect.options[2].text='Challenge';", "speedSelect.options[0].text='Tactile slow';speedSelect.options[1].text='Tactile turn-based';speedSelect.options[2].text='Relaxed';speedSelect.options[3].text='Standard';speedSelect.options[4].text='Challenge';")

          # Make the tactile legend accurately describe the new pin grammar.
          text = text.replace('촘촘한 면: 고정 블록', '작은 촘촘한 면: 고정 블록').replace('테두리: 움직이는 블록', '큰 빈 테두리: 움직이는 블록')
          text = text.replace('Dense: settled block', 'Compact dense tile: settled block').replace('Outline: moving piece', 'Large hollow outline: moving piece')
          text = text.replace('촘촘=고정 · 테두리=현재 · 두 점=착지', '작은 면=고정 · 큰 테두리=현재 · 두 점=착지')

          index_path.write_text(text, encoding='utf-8')

          # SuperDot naming and explicit alias while keeping backward compatibility.
          tts_path = Path('screen-flow-standalone/tts.js')
          tts = tts_path.read_text(encoding='utf-8')
          tts = tts.replace('TW_TTS v2 — Dot Games 공용 음성(TTS) 모듈', 'SUPERDOT TTS v2 — Dot Games 공용 음성(TTS) 모듈', 1)
          tts = tts.replace('  window.TW_TTS = {', '  window.TW_TTS = {', 1)
          tts = tts.replace("  };\n})();", "  };\n  window.SUPERDOT_TTS = window.TW_TTS;\n})();", 1)
          tts_path.write_text(tts, encoding='utf-8')

          # Consistent 2D flat item icon family.
          items = Path('screen-flow-standalone/assets/items')
          items.mkdir(parents=True, exist_ok=True)
          svgs = {
          'star.svg': '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect x="4" y="4" width="56" height="56" rx="16" fill="#10233f"/><path d="M32 13l5.7 11.6 12.8 1.9-9.3 9 2.2 12.7L32 42.2 20.6 48.2l2.2-12.7-9.3-9 12.8-1.9L32 13z" fill="#FFD35A"/><path d="M32 18.5v18.8" stroke="#FFF3B0" stroke-width="3" stroke-linecap="round" opacity=".78"/></svg>''',
          'bomb.svg': '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect x="4" y="4" width="56" height="56" rx="16" fill="#10233f"/><circle cx="29" cy="36" r="15" fill="#FF6B5F"/><path d="M38 25l6-6" stroke="#F7FAFF" stroke-width="5" stroke-linecap="round"/><path d="M44 18l3-5m1 8l5-2m-9 5l2 5" stroke="#FFD35A" stroke-width="3" stroke-linecap="round"/><circle cx="24" cy="31" r="4" fill="#FFB0A9"/></svg>''',
          'rainbow.svg': '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect x="4" y="4" width="56" height="56" rx="16" fill="#10233f"/><path d="M14 43a18 18 0 0136 0" fill="none" stroke="#FF6B5F" stroke-width="8" stroke-linecap="round"/><path d="M20 43a12 12 0 0124 0" fill="none" stroke="#FFD35A" stroke-width="8" stroke-linecap="round"/><path d="M26 43a6 6 0 0112 0" fill="none" stroke="#61C6FF" stroke-width="8" stroke-linecap="round"/><circle cx="15" cy="44" r="6" fill="#F7FAFF"/><circle cx="49" cy="44" r="6" fill="#F7FAFF"/></svg>''',
          'random.svg': '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect x="4" y="4" width="56" height="56" rx="16" fill="#10233f"/><path d="M15 22h8c9 0 10 20 19 20h7" fill="none" stroke="#61C6FF" stroke-width="5" stroke-linecap="round"/><path d="M15 42h8c9 0 10-20 19-20h7" fill="none" stroke="#A77BFF" stroke-width="5" stroke-linecap="round"/><path d="M45 17l6 5-6 5M45 37l6 5-6 5" fill="none" stroke="#F7FAFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>'''
          }
          for name, svg in svgs.items():
              (items / name).write_text(svg + '\n', encoding='utf-8')

          # Lightweight static checks before committing.
          required = [
              "speechMode:'superdot'", "value=\"turn\"", "confirmedHardDrop", "enterPadSettings",
              "kind==='flash'", "window.SUPERDOT_TTS", "Tactile turn-based"
          ]
          merged = index_path.read_text(encoding='utf-8') + tts_path.read_text(encoding='utf-8')
          missing = [x for x in required if x not in merged]
          if missing:
              raise SystemExit('post-patch checks failed: ' + ', '.join(missing))
          if merged.count('function handleDotPadKey') != 1 or merged.count('function fillTactileCell') != 1:
              raise SystemExit('duplicate core function detected')
          print('Blind-first P0 upgrade applied and statically checked.')
          PY

      - name: Commit upgrade
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add screen-flow-standalone/index.html screen-flow-standalone/tts.js screen-flow-standalone/assets/items
          git commit -m 'feat: complete blind-first tactile and TTS P0 upgrade'
          git push
